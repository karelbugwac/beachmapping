<svg viewBox="0 0 400 300" fill="none" xmlns="http://www.w3.org/2000/svg">
  <!-- Background landscape -->
  <rect width="400" height="300" fill="#F8FAFC"/>
  
  <!-- Horizon line (purple) -->
  <line x1="0" y1="200" x2="400" y2="200" stroke="#8B5CF6" stroke-width="2"/>
  
  <!-- Grey hill -->
  <path d="M0 200 Q 100 160 200 180 T 400 170 V 300 H 0 Z" fill="#E2E8F0"/>
  
  <!-- Ground -->
  <rect x="0" y="220" width="400" height="80" fill="#CBD5E1"/>
  
  <!-- Glass bottle -->
  <g transform="translate(120, 80)">
    <!-- Bottle body -->
    <path d="M 40 60 Q 10 100 10 140 Q 10 160 20 170 L 100 170 Q 110 160 110 140 Q 110 100 80 60 Z" 
          fill="rgba(200, 230, 255, 0.3)" stroke="#94A3B8" stroke-width="2"/>
    
    <!-- Bottle neck -->
    <rect x="45" y="30" width="30" height="30" fill="rgba(200, 230, 255, 0.3)" stroke="#94A3B8" stroke-width="2"/>
    
    <!-- Cork -->
    <rect x="42" y="20" width="36" height="12" rx="2" fill="#A0522D"/>
    <rect x="45" y="18" width="30" height="4" fill="#8B4513"/>
    
    <!-- Bottle shine -->
    <path d="M 20 90 Q 30 130 25 160" stroke="rgba(255,255,255,0.4)" stroke-width="3" fill="none"/>
  </g>
  
  <!-- Crab inside bottle -->
  <g transform="translate(145, 130)">
    <!-- Body -->
    <ellipse cx="25" cy="30" rx="25" ry="20" fill="#FF6B35"/>
    
    <!-- Shell stripes -->
    <path d="M 5 30 Q 25 20 45 30" stroke="#E85D2D" stroke-width="2" fill="none"/>
    <path d="M 3 35 Q 25 25 47 35" stroke="#E85D2D" stroke-width="2" fill="none"/>
    
    <!-- Eyes -->
    <circle cx="18" cy="25" r="4" fill="white"/>
    <circle cx="32" cy="25" r="4" fill="white"/>
    <circle cx="18" cy="25" r="2" fill="#1E293B"/>
    <circle cx="32" cy="25" r="2" fill="#1E293B"/>
    
    <!-- Eyebrows (worried) -->
    <path d="M 14 20 Q 18 18 22 20" stroke="#1E293B" stroke-width="1.5" fill="none"/>
    <path d="M 28 20 Q 32 18 36 20" stroke="#1E293B" stroke-width="1.5" fill="none"/>
    
    <!-- Mouth (worried) -->
    <path d="M 20 35 Q 25 32 30 35" stroke="#1E293B" stroke-width="1.5" fill="none"/>
    
    <!-- Left claw holding pen -->
    <g transform="translate(-15, 5)">
      <path d="M 0 0 L -20 -5 L -25 5 L -15 10 Z" fill="#FF6B35"/>
      <circle cx="-20" cy="5" r="3" fill="#E85D2D"/>
      <!-- Pen -->
      <rect x="-35" y="0" width="20" height="4" fill="#2563EB" rx="1"/>
      <rect x="-38" y="-2" width="4" height="8" fill="#1E40AF"/>
    </g>
    
    <!-- Right claw -->
    <g transform="translate(40, 5)">
      <path d="M 0 0 L 20 -5 L 25 5 L 15 10 Z" fill="#FF6B35"/>
      <circle cx="20" cy="5" r="3" fill="#E85D2D"/>
    </g>
    
    <!-- Legs -->
    <line x1="15" y1="48" x2="10" y2="60" stroke="#FF6B35" stroke-width="3"/>
    <line x1="35" y1="48" x2="40" y2="60" stroke="#FF6B35" stroke-width="3"/>
  </g>
  
  <!-- Orange exclamation mark above crab -->
  <g transform="translate(170, 110)">
    <circle cx="0" cy="0" r="12" fill="#FF9737"/>
    <text x="0" y="6" text-anchor="middle" fill="white" font-size="16" font-weight="bold">!</text>
  </g>
  
  <!-- Magenta scroll inside bottle -->
  <g transform="translate(160, 160)">
    <!-- Scroll body -->
    <rect x="0" y="0" width="30" height="40" rx="5" fill="#EC4899"/>
    <!-- Scroll ends -->
    <rect x="-3" y="5" width="36" height="4" rx="2" fill="#DB2777"/>
    <rect x="-3" y="31" width="36" height="4" rx="2" fill="#DB2777"/>
    <!-- Lines on scroll -->
    <line x1="5" y1="12" x2="25" y2="12" stroke="#F472B6" stroke-width="2"/>
    <line x1="5" y1="18" x2="25" y2="18" stroke="#F472B6" stroke-width="2"/>
    <line x1="5" y1="24" x2="25" y2="24" stroke="#F472B6" stroke-width="2"/>
  </g>
  
  <!-- Small bubbles in bottle -->
  <circle cx="155" cy="95" r="2" fill="rgba(255,255,255,0.5)"/>
  <circle cx="165" cy="100" r="1.5" fill="rgba(255,255,255,0.4)"/>
  <circle cx="145" cy="105" r="2" fill="rgba(255,255,255,0.3)"/>
</svg>